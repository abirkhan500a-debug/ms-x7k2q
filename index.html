<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motion Studio বাংলা</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0d12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d12;--panel:#151720;--panel2:#1c1f2b;--line:#2a2e3d;--ink:#f4f5f8;--mute:#9aa0b4;
  --amber:#f5a623;--amber2:#ffcb5c;--red:#ef4444;--green:#22c55e;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060a;color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali","Nirmala UI","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 0 1px #1a1d29}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px 28px}
h1,h2,h3{margin:0}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hide{display:none!important}

/* nav */
#nav{display:flex;border-top:1px solid var(--line);background:#0a0b10;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--mute);font-size:11.5px;border-radius:12px}
#nav button span{font-size:19px;line-height:1.2}
#nav button.on{color:var(--amber)}

/* generic */
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top h2{font-size:16px;font-weight:600}
.ib{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sec{margin-top:16px}
.lab{font-size:12.5px;color:var(--mute);margin:0 0 7px;display:flex;gap:6px;align-items:center}
.lab b{color:var(--amber);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(180deg,#ffb83a,#f09a0b);color:#1b1200;border:0;box-shadow:0 6px 18px rgba(245,166,35,.22)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.red{background:#3a1717;border-color:#5a2222;color:#ffb3b3}
.btn:disabled{opacity:.55;pointer-events:none}
.link{color:var(--amber);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap;color:#d4d7e3}
.chip.on{border-color:var(--amber);color:var(--amber2);background:#241b08}
.scroll-x{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
input[type=text],input[type=number],input[type=password],input[type=url],textarea,select{width:100%;background:#0f1118;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:90px;font-size:14.5px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:150px}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=color]{width:42px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tg{position:relative;width:44px;height:25px;border-radius:99px;background:#2b2f40;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--amber)}
.tg.on::after{left:22px}

/* home */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ffc24d,#f08c00);color:#2b1900;font-weight:800;display:grid;place-items:center;font-size:15px}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:18px;background:linear-gradient(135deg,#ffb52e,#f08c00);color:#1d1200;margin-top:14px}
.cta .plus{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.15);display:grid;place-items:center;font-size:24px}
.cta b{display:block;font-size:17px}
.cta small{opacity:.75}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 9px;text-align:left;min-height:92px;display:flex;flex-direction:column;gap:3px}
.tile span{font-size:21px}
.tile b{font-size:12.5px;font-weight:600;line-height:1.25}
.tile small{font-size:10.5px;color:var(--mute);line-height:1.25}
.badge{display:inline-block;font-size:9.5px;font-weight:700;background:var(--amber);color:#201400;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:middle}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pitem{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.pitem .th{aspect-ratio:1/1;background:#000 center/contain no-repeat}
.pitem .nm{padding:7px 9px 8px;font-size:12.5px;line-height:1.3}
.pitem .nm small{display:block;color:var(--mute);font-size:10.5px}
.pitem .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);font-size:12px;display:grid;place-items:center}
.empty{text-align:center;color:var(--mute);padding:26px 10px;border:1px dashed var(--line);border-radius:14px}

/* looks */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--panel2);text-align:center}
.look.on{border-color:var(--amber)}
.look canvas{display:block;width:100%;aspect-ratio:16/10;background:#000}
.look small{display:block;font-size:10.5px;padding:3px 2px 4px;color:#cfd3e2}
.look.auto{display:grid;place-items:center;aspect-ratio:16/12.3;font-weight:800;letter-spacing:.1em;font-size:13px;color:var(--amber)}
.look.auto small{display:none}
.szrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sz{border:1.5px solid var(--line);border-radius:12px;padding:9px 4px 7px;background:var(--panel2);text-align:center;font-size:11px;color:var(--mute)}
.sz i{display:block;margin:0 auto 5px;border:1.5px solid #8b91a8;border-radius:3px}
.sz b{display:block;font-size:12.5px;color:var(--ink)}
.sz.on{border-color:var(--amber)}
.sz.on i{border-color:var(--amber)}
.hint{font-size:12px;color:var(--mute);background:#10121a;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.err{background:#2a1414;border:1px solid #5a2323;color:#ffb8b8;border-radius:12px;padding:9px 11px;font-size:13px;white-space:pre-wrap}
.ok{background:#102418;border:1px solid #1f5a36;color:#a7f3c4;border-radius:12px;padding:9px 11px;font-size:13px}

/* editor */
.ed{display:flex;flex-direction:column;height:100%}
.ed-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg)}
.ed-top input{background:none;border:0;padding:6px;font-weight:600;font-size:15px;min-width:0}
.ed-top .exp{background:#fff;color:#111;font-weight:700;border-radius:10px;padding:7px 14px;font-size:13px}
.stage{flex:1;min-height:90px;background:#000;display:grid;place-items:center;overflow:hidden;position:relative}
.stage canvas{display:block;background:#111;max-width:100%;max-height:100%}
.ctrl{display:flex;align-items:center;gap:10px;padding:8px 12px}
.ctrl .play{width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:13px;flex:none}
.ctrl .tm{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;min-width:70px;text-align:right}
.sc-chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 7px;scrollbar-width:none}
.sc-chips::-webkit-scrollbar{display:none}
.sc-chips .chip{font-size:11.5px;padding:5px 9px}
.tools{display:flex;overflow-x:auto;border-top:1px solid var(--line);background:#0a0b10;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;min-width:62px;padding:7px 6px 6px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tools button span{font-size:18px;line-height:1.2}
.tools button.on{color:var(--amber)}
.sheet{background:var(--panel);border-top:1px solid var(--line);max-height:44%;overflow-y:auto;padding:12px 14px 18px;border-radius:16px 16px 0 0;flex:none}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.sheet .hd button{color:var(--amber);font-size:13px}
.elc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:9px}
.elc .eh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--amber);margin-bottom:6px;font-weight:600}
.elc .eh div{display:flex;gap:4px}
.elc .eh button{width:26px;height:26px;border-radius:8px;background:#0f1118;color:#cfd3e2;font-size:12px}
.elc input,.elc textarea,.elc select{margin-bottom:6px;padding:8px 10px;font-size:14px}
.elc textarea{min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.colset{width:56px;height:30px;border-radius:9px;border:2px solid var(--line);display:flex;overflow:hidden}
.colset i{flex:1}
.colset.on{border-color:var(--amber)}
.slot{display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.slot img,.slot .ph{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#0f1118;display:grid;place-items:center;font-size:20px;flex:none}
.issue{display:flex;gap:8px;padding:8px 10px;background:var(--panel2);border-radius:10px;margin-bottom:6px;font-size:13px}
.issue.w{border-left:3px solid var(--amber)}
.issue.e{border-left:3px solid var(--red)}
.issue.g{border-left:3px solid var(--green)}

/* progress / toast */
.prog{height:9px;border-radius:99px;background:#222637;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb83a,#ffd36e);transition:width .2s}
#toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,20px);background:#fff;color:#111;padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:absolute;inset:0;background:rgba(5,6,10,.82);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #2b2f40;border-top-color:var(--amber);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
video.out{width:100%;max-height:46vh;background:#000;border-radius:12px}
.fontlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.fontrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);text-align:left}
.fontrow.on{border-color:var(--amber)}
.fontrow small{color:var(--mute);font-size:11px;white-space:nowrap}

details.adv{margin-top:4px}
details.adv summary{cursor:pointer;color:var(--mute);font-size:12px;padding:3px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
.elc.sel{border-color:var(--amber)}
details.hlp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
details.hlp summary{font-weight:600;cursor:pointer}
details.hlp div{margin-top:6px;line-height:1.6}

</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav id="nav"></nav>
  <div id="toast"></div>
</div>
<script>
/* =====================================================================
   ENGINE — scene JSON -> canvas frames
   ===================================================================== */
const DEF_FONT = '"Hind Siliguri","Noto Sans Bengali","Nirmala UI","Kalpurush","Segoe UI",system-ui,sans-serif';
let FONT = DEF_FONT;
const fontStack = n => n ? `"${String(n).replace(/"/g, '')}",${DEF_FONT}` : DEF_FONT;
const useFont = p => { FONT = fontStack(p && p.font); };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  bounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
};
const BNd = '০১২৩৪৫৬৭৮৯';
const toBn = s => String(s).replace(/\d/g, d => BNd[d]);
const fmtNum = (n, bn, dec = 0) => {
  const s = Number(n).toLocaleString('en-US', { maximumFractionDigits: dec, minimumFractionDigits: dec });
  return bn ? toBn(s) : s;
};
const hex2rgb = h => { h = String(h || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };
const lum = h => { const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = h => lum(h) > .42 ? '#121212' : '#ffffff';
const mixc = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

/* ---------------- LOOKS ---------------- */
const LOOKS = [
  { id: 'mint',    name: 'Fresh Mint',   tags: ['Product', 'Brand', 'নতুন'], desc: 'light mint, friendly, clean', bg: ['#dff5ee', '#b9e4d8'], ink: '#0e3b34', accent: '#0fa37f', accent2: '#f4a62a', decor: 'blobs', card: 'solid' },
  { id: 'soft',    name: 'Soft Product', tags: ['Product'], desc: 'soft white/blue, minimal product look', bg: ['#f3f6fd', '#dfe8fb'], ink: '#15213d', accent: '#3b6cf6', accent2: '#ff8a5b', decor: 'dots', card: 'solid' },
  { id: 'cine',    name: 'Cinematic',    tags: ['গল্প', 'Brand'], desc: 'dark cinematic with letterbox, gold accent, for stories & documentary', bg: ['#0a0a0c', '#1c1612'], ink: '#f6efe3', accent: '#e8b04a', accent2: '#c2410c', decor: 'cine', card: 'glass' },
  { id: 'apple',   name: 'Apple-style',  tags: ['Product', 'Brand'], desc: 'white, large type, calm, premium tech', bg: ['#ffffff', '#f2f2f5'], ink: '#111113', accent: '#0071e3', accent2: '#bf5af2', decor: 'none', card: 'solid' },
  { id: 'hud',     name: 'Tech HUD',     tags: ['Tech', '3D'], desc: 'dark navy grid, cyan HUD, for tech/AI/data', bg: ['#050b1a', '#0b1a33'], ink: '#e6f4ff', accent: '#22d3ee', accent2: '#818cf8', decor: 'grid', card: 'outline' },
  { id: 'medical', name: 'Medical Clean',tags: ['Product', 'Brand'], desc: 'white & teal, trustworthy health/clinic', bg: ['#f2fbfb', '#d9f1f2'], ink: '#0b3d44', accent: '#0891b2', accent2: '#22c55e', decor: 'blobs', card: 'solid' },
  { id: 'retro',   name: 'Retro Neon',   tags: ['3D', 'নতুন'], desc: 'synthwave purple, pink and cyan neon', bg: ['#1a0b3b', '#3b0f5e'], ink: '#fff1ff', accent: '#ff3cac', accent2: '#2de2e6', decor: 'retro', card: 'outline' },
  { id: 'food',    name: 'Food Warm',    tags: ['Product', 'Brand'], desc: 'warm orange/cream, appetizing, shops & food', bg: ['#fff1d6', '#ffd9a0'], ink: '#4a1d05', accent: '#e8590c', accent2: '#c92a2a', decor: 'blobs', card: 'solid' },
  { id: 'neon',    name: 'Neon Glow',    tags: ['Tech', '3D'], desc: 'black with green neon glow, bold & energetic', bg: ['#020a06', '#06201a'], ink: '#eafff4', accent: '#2cff9a', accent2: '#00c2ff', decor: 'particles', card: 'outline' },
  { id: 'aurora',  name: 'Aurora',       tags: ['নতুন', 'Brand'], desc: 'deep blue with flowing aurora gradients, modern', bg: ['#0a0f2c', '#1b1450'], ink: '#f2f0ff', accent: '#7cf0c9', accent2: '#c084fc', decor: 'aurora', card: 'glass' },
  { id: 'luxury',  name: 'Luxury',       tags: ['Brand', 'গল্প'], desc: 'black and gold, premium, elegant', bg: ['#0b0b0b', '#1d1809'], ink: '#f7f0da', accent: '#d4af37', accent2: '#f5e6a8', decor: 'rays', card: 'outline' },
  { id: 'clean',   name: 'Clean Light',  tags: ['Product', 'Brand'], desc: 'plain light grey/white, neutral, corporate', bg: ['#fafafa', '#eceef2'], ink: '#14161c', accent: '#111827', accent2: '#ef4444', decor: 'none', card: 'solid' },
  { id: 'glass',   name: 'Glass UI',     tags: ['Product', 'নতুন'], desc: 'purple/blue gradient with frosted glass cards', bg: ['#2b1c6b', '#1a5fb4'], ink: '#ffffff', accent: '#ffd166', accent2: '#ff6b9d', decor: 'glass', card: 'glass' },
  { id: 'sunset',  name: 'Sunset Pop',   tags: ['Brand', 'নতুন'], desc: 'coral to orange pop colours, youthful, social', bg: ['#ff6a5c', '#ffb347'], ink: '#fffaf0', accent: '#2b1055', accent2: '#ffffff', decor: 'blobs', card: 'solid' },
  { id: 'paper',   name: 'Paper Cream',  tags: ['গল্প', 'Brand'], desc: 'cream paper with ink, storytelling, education', bg: ['#f7efe0', '#eadcc0'], ink: '#2d2013', accent: '#b4412e', accent2: '#2f6f6a', decor: 'dots', card: 'solid' },
  { id: 'night',   name: 'Midnight Blue',tags: ['Brand', 'Tech'], desc: 'dark blue with amber highlights, news & finance', bg: ['#0c1630', '#142550'], ink: '#eef2ff', accent: '#ffb020', accent2: '#4cc9f0', decor: 'particles', card: 'glass' },
];
LOOKS.push(
  { id: 'kungfu',  name: 'Kung Fu Ink',  tags: ['মোশন', 'গল্প', 'নতুন'], desc: 'ink-wash mountains with red sun on cream paper, kung fu, calm discipline, chinese martial arts', bg: ['#efe9df', '#d9d0c1'], ink: '#1a1613', accent: '#b3261e', accent2: '#3a3a3a', decor: 'inkwash', card: 'solid' },
  { id: 'martial', name: 'Martial Arts', tags: ['মোশন', 'নতুন'], desc: 'dark red with speed lines, intense fighting, sparring, self defence, action', bg: ['#1a0a0b', '#3a1114'], ink: '#ffffff', accent: '#e11d2e', accent2: '#ffffff', decor: 'speed', card: 'glass' },

async function fileToDataURL(file, max = 900) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('ছবি পড়া যায়নি')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);

    return cv.toDataURL(png ? 'image/png' : 'image/jpeg', .82);
  } finally { URL.revokeObjectURL(url); }
}

A.vGen = async () => {
  const f = S.vf, d = S.vdraft; if (!f) return toast('আগে ফাইল বাছুন'); setErr('');
  S.ctl = new AbortController(); busy('অডিও প্রস্তুত হচ্ছে…', true);
  try {
    const dur = f.dur || await mediaDuration(f); if (!isFinite(dur) || dur < 1) throw new Error('ফাইলের দৈর্ঘ্য পড়া যায়নি'); if (dur > 600) throw new Error('১০ মিনিটের বেশি লম্বা ফাইল এখন সাপোর্ট করে না');
    const txt = d.text.trim(); const isSrt = /-->/.test(txt); let b64 = null, mime = '';
    if (!isSrt) { try { b64 = bufToB64(await fileToWav16k(f)); mime = 'audio/wav'; } catch (e) { if (f.size < 14e6) { b64 = bufToB64(await f.arrayBuffer()); mime = f.type || 'audio/mpeg'; } else throw new Error('অডিও পড়া যায়নি। ফাইলটি ছোট বা MP3/M4A করে দিন।'); } }
    busyMsg('Gemini কথা শুনে সিন সাজাচ্ছে…');
    const raw = await aiVoice(d, b64, mime, txt, dur, S.ctl.signal);
    const p = normProject(raw, { size: d.size, look: d.look, lang: d.lang, subOn: true });
    // timing from start/end
    const st = (raw.scenes || []).map(s => num(s.start, s.s)); if (st.every(isFinite) && st.length === p.scenes.length) { for (let i = 0; i < p.scenes.length; i++) { const e = i + 1 < st.length ? st[i + 1] : dur; p.scenes[i].dur = clamp(e - st[i], 1, 60); } }
    else { const sum = p.scenes.reduce((a, s) => a + s.dur, 0); p.scenes.forEach(s => s.dur = clamp(s.dur * dur / sum, 1, 60)); }
    if (isSrt) p.subs = parseSRT(txt);
    p.voice = { name: f.name, isVideo: f.type.startsWith('video'), mode: d.mode, dur }; TMP.voice[p.id] = f; IDB.put('voice:' + p.id, f);
    busyOff(); openProject(p, true);
  } catch (e) { busyOff(); if (e.name !== 'AbortError') setErr(friendlyErr(e)); }
};

  ['Hind Siliguri', 'Hind+Siliguri:wght@400;500;600;700;800'], ['Noto Sans Bengali', 'Noto+Sans+Bengali:wght@400;500;600;700;800'],

const SAMPLE = 'আমার সোনার বাংলা Aa';
const _loaded = new Set();
S.customFonts = LS.get('ms_fonts', []);
async function ensureFont(name) {
  if (!name || _loaded.has(name)) return true;
  const g = GFONTS.find(f => f[0] === name);
  try {
    if (g) {
      if (!document.querySelector(`link[data-gf="${name}"]`)) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.dataset.gf = name; l.href = `https://fonts.googleapis.com/css2?family=${g[1]}&display=swap`; document.head.appendChild(l); await new Promise(r => { l.onload = l.onerror = r; setTimeout(r, 4000); }); }
      await Promise.race([Promise.all([document.fonts.load(`400 30px "${name}"`), document.fonts.load(`700 30px "${name}"`), document.fonts.load(`800 30px "${name}"`)]), sleep(4000)]);
    } else if (S.customFonts.includes(name)) {
      const buf = await IDB.get('font:' + name); if (!buf) return false;
      const ff = new FontFace(name, buf); await ff.load(); document.fonts.add(ff);
    } else return false;
    _loaded.add(name); requestRender(); return true;
  } catch (e) { return false; }
}
async function loadCustomFonts() { for (const n of S.customFonts) await ensureFont(n); }
async function addCustomFont(file) {
  const buf = await file.arrayBuffer(); let name = file.name.replace(/\.[^.]+$/, '').replace(/[^\wঀ-৿ -]+/g, ' ').trim().slice(0, 30) || 'MyFont';
  if (GFONTS.some(f => f[0] === name) || S.customFonts.includes(name)) name += ' ' + (S.customFonts.length + 1);
  const ff = new FontFace(name, buf); await ff.load(); document.fonts.add(ff);
  await IDB.put('font:' + name, buf); S.customFonts.push(name); LS.set('ms_fonts', S.customFonts); _loaded.add(name); return name;
}

function sceneFit(p, sc) {
  useFont(p);

}
function runQC(p) {

  p.scenes.forEach((sc, i) => {
    const n = i + 1, w = sceneWords(sc);
    sc.els.forEach(e => {
      if (e.type === 'title' && (e.t || '').length > 70) out.push({ k: 'w', m: `সিন ${n}: শিরোনাম অনেক লম্বা (${e.t.length} অক্ষর) — ছোট করুন` });
      if (e.type === 'image' && !p.images[e.slot] && !noImg.has(e.slot)) { noImg.add(e.slot); out.push({ k: 'e', m: `সিন ${n}: ছবির জায়গা ফাঁকা (${e.slot}) — "🖼 ছবি" টুলে ছবি দিন` }); }
      if (e.type === 'avatar' && !p.images[e.slot || 'photo']) out.push({ k: 'e', m: `সিন ${n}: প্রোফাইল ছবি দেওয়া হয়নি` });
    });
    const need = 1.8 + w * .33; if (!p.voice && sc.dur < need - .5) out.push({ k: 'w', m: `সিন ${n}: ${w}টি শব্দ ${(+sc.dur).toFixed(1)}s-এ পড়া কঠিন — অন্তত ${Math.ceil(need)}s দিন`, fix: 1 });
    const f = sceneFit(p, sc); if (f < .72) out.push({ k: 'w', m: `সিন ${n}: লেখা বেশি, ছোট করে দেখানো হচ্ছে — কিছু লেখা কমান বা ভাগ করুন` });
    if (sc.els.length > 5) out.push({ k: 'w', m: `সিন ${n}: একসাথে ${sc.els.length}টি জিনিস — ভিড় লাগতে পারে` });
  });
  const c = p.colors || {}; if (c.bg && c.ink) { const a = lum(c.bg), b = lum(c.ink), r = (Math.max(a, b) + .05) / (Math.min(a, b) + .05); if (r < 3.5) out.push({ k: 'e', m: `রঙ: লেখা ও ব্যাকগ্রাউন্ডের পার্থক্য কম (${r.toFixed(1)}:1) — পড়তে কষ্ট হবে` }); }
  const tot = timeline(p).total; if (tot > 90) out.push({ k: 'w', m: `ভিডিও ${fmtT(tot)} লম্বা — রিলস/স্টোরির জন্য ৬০s-এর মধ্যে ভালো` });
  if (!out.length) out.push({ k: 'g', m: '✓ সব ঠিক আছে — লেখার মাপ, সময় ও রং ভালো দেখাচ্ছে' }); return out;
}

    await gdAuth(true); GD.set('sync', 'ড্রাইভ থেকে ডেটা মেলানো হচ্ছে…');
    const got = await gdPull(); GD.metaDirty = true; await gdFlush(true);
    if (got) { toast(`☁ ড্রাইভ থেকে ${toBn(got)}টি প্রজেক্ট এসেছে`, 3000); if (['home', 'projects'].includes(S.screen)) render(true); }
    else toast('☁ গুগল ড্রাইভ সংযুক্ত হয়েছে');
  } catch (e) { GD.set(e.needUser ? 'need' : 'err', friendlyErr(e).split('\n')[0]); }
}
function gdKick() { // after a reload the 1-hour token is gone; renew silently on the first tap (popups need a user gesture)
  if (!GD.on()) return; const h = () => { document.removeEventListener('pointerdown', h, true); if (GD.tok && Date.now() < GD.exp - 60000) { GD.schedule(500); return; } gdAuth(false).then(async () => { try { await gdPull(); } catch (e) { } if (['home', 'projects'].includes(S.screen)) render(true); GD.schedule(300); }).catch(() => GD.set('need', 'ড্রাইভে সেভ চালু রাখতে "সংযুক্ত করুন" চাপুন (সেটিংস → Google Drive)')); };
  document.addEventListener('pointerdown', h, true);
}
A.gdConnect = gdConnect;
A.gdSyncNow = async () => { if (!GD.on()) return gdConnect(); try { await gdAuth(true); await gdPull(); GD.metaDirty = true; await gdFlush(true); if (['home', 'projects'].includes(S.screen)) render(true); } catch (e) { GD.set(e.needUser ? 'need' : 'err', friendlyErr(e).split('\n')[0]); } };
A.gdOff = () => { S.settings.gdOn = false; saveSettings(); GD.set('off'); toast('গুগল ড্রাইভ সিঙ্ক বন্ধ (ড্রাইভের ফাইল যেমন আছে থাকবে)'); render(true); };
A.gdPlus = () => { const o = location.origin; try { navigator.clipboard.writeText(o); toast('Origin কপি হয়েছে: ' + o, 3500); } catch (e) { prompt('এই ঠিকানা Authorized JavaScript origins-এ বসান:', o); } };
document.addEventListener('visibilitychange', () => { if (document.hidden && GD.on() && (GD.q.size || GD.metaDirty)) { clearTimeout(GD.timer); GD.flush(); } });
window.addEventListener('online', () => { if (GD.on() && (GD.q.size || GD.metaDirty)) GD.schedule(1500); });
function GDCard() {
  const s = S.settings, on = GD.on();
  return `<div class="card sec"><div class="lab">☁️ Google Drive অটো-সেভ</div>
    <div class="muted small" style="margin-bottom:8px">চালু থাকলে কাজ করার সময় প্রজেক্ট, ভয়েস/গান ও "আমার Look" নিজে থেকে আপনার Drive-এর <b>MotionStudio</b> ফোল্ডারে সেভ হবে। নতুন ফোন/ব্রাউজারে একই অ্যাকাউন্টে সংযুক্ত করলেই সব ফিরে আসবে।</div>
    ${GD_CLIENT_DEFAULT ? '' : `<input type="text" data-b="settings.gdClient" data-save="1" placeholder="Google OAuth Client ID (…apps.googleusercontent.com)" value="${esc(s.gdClient || '')}" autocomplete="off" spellcheck="false">`}
    <div class="row wrap" style="margin-top:8px"><button class="btn sm pri grow" data-a="${on ? 'gdSyncNow' : 'gdConnect'}">${on ? '🔄 এখনই সিঙ্ক' : '🔗 সংযুক্ত করুন'}</button>${on ? '<button class="btn sm" data-a="gdOff">বন্ধ করুন</button>' : ''}</div>
    <div id="gdstat" class="muted small" style="margin-top:8px">${gdStatHTML()}</div>
    ${GD_CLIENT_DEFAULT ? '' : `<details class="hlp"><summary>Client ID কীভাবে বানাবেন? (একবারই)</summary><div class="muted small" style="line-height:1.7">
      ১. <a class="link" href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">console.cloud.google.com</a>-এ নতুন Project বানান।<br>
      ২. APIs &amp; Services → Library → <b>Google Drive API</b> → Enable।<br>
      ৩. OAuth consent screen → External → নাম দিন → Test users-এ নিজের Gmail যোগ করুন → Save।<br>
      ৪. Credentials → Create credentials → <b>OAuth client ID</b> → Web application।<br>
      ৫. <b>Authorized JavaScript origins</b>-এ এই অ্যাপ যে ঠিকানায় খোলেন সেটি দিন (<button class="link" data-a="gdPlus">এখনকার ঠিকানা কপি করুন</button>)।<br>
      ৬. তৈরি হওয়া Client ID উপরের ঘরে বসিয়ে "সংযুক্ত করুন" চাপুন।<br>
      <i>দ্রষ্টব্য: ফাইল সরাসরি (file://) খুললে বা Canvas প্রিভিউতে Google সাইন-ইন চলে না — অ্যাপটি Netlify/GitHub Pages/Vercel-এর মতো একটি https ঠিকানায় রাখুন।</i></div></details>`}</div>`;
}
async function gdDeleted(id) {
  GD.q.delete(id); const m = GD.map[id];
  if (!m || !GD.on()) { delete GD.map[id]; GD.save(); return; }
  m.deleted = true; GD.save();
  try {
    for (const f of [m.id, m.voice && m.voice.id, m.music && m.music.id]) if (f) await gdApi(`${GDF}/${f}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: '{"trashed":true}' });
    delete GD.map[id]; GD.save();
  } catch (e) { /* stays flagged; trashed on next sync */ }
}

   BOOT
   ===================================================================== */
(async function boot() {
  try { await Promise.race([document.fonts.load('800 40px "Hind Siliguri"'), sleep(1500)]); await document.fonts.load('500 30px "Hind Siliguri"'); } catch (e) { }
  await loadCustomFonts(); await ensureFont(S.settings.font);
  window.addEventListener('resize', () => { if (S.screen === 'editor') fitStage(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && PL.playing) plPause(); });
  render(); gdKick();
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
})();

</script>
